[project]
name = "mo-teach"
version = "0.1.0"
description = "MO Academy teaching library: broker, MC providers/consumers, lab grading harness"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
]

[project.scripts]
grade = "mo_teach.grading.cli:main"

[tool.setuptools.packages.find]
include = ["mo_teach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
