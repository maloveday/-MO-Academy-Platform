name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check apps/api/app apps/api/tests apps/api/alembic packages/mo_teach

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e packages/mo_teach
          pip install -e 'apps/api[dev]'
      - name: mo_teach tests (incl. grading harness self-test)
        run: python -m pytest packages/mo_teach/tests -q
      - name: API tests
        working-directory: apps/api
        run: python -m pytest -q
      - name: Migrations apply cleanly and idempotently
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/ci-migrate.sqlite3
        run: |
          alembic upgrade head
          alembic upgrade head
          python -m app.seed
          python -m app.seed

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t mo-academy-api .
      - name: Build grader sandbox image
        run: docker build -f infra/grader.Dockerfile -t mo-academy-grader .
      - name: Boot and smoke-test
        run: |
          docker run -d --rm --name mo-api -p 8000:8000 mo-academy-api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/ | grep -q "MO Academy"
          docker stop mo-api
