<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MO Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F0D; --panel:#101612; --line:#2A2416;
  --amber:#FFB000; --amber-dim:#8A6A1F;
  --ink:#D8D4C8; --ink-dim:#8F8B7E;
  --valid:#3FBF7F; --err:#E5484D;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; --disp:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  min-height:100vh;display:grid;place-items:center;padding:24px}
a{color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--amber-dim);padding:40px;max-width:440px;width:100%}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber-dim);text-transform:uppercase}
h1{font-family:var(--disp);font-size:26px;margin:10px 0 8px}
p{color:var(--ink-dim);font-size:15px;margin-bottom:24px}
form{display:flex;flex-direction:column;gap:12px}
label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
input{font-family:var(--mono);font-size:14px;padding:13px 16px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink)}
input::placeholder{color:var(--ink-dim)}
button{font-family:var(--mono);font-size:14px;letter-spacing:.04em;padding:13px 22px;
  border:1px solid var(--amber);background:var(--amber);color:#161006;font-weight:600;cursor:pointer}
button:hover{background:#FFC63D}
.status{font-family:var(--mono);font-size:13px;margin-top:14px;min-height:1.4em}
.status.ok{color:var(--valid)}
.status.err{color:var(--err)}
.back{font-family:var(--mono);font-size:12px;margin-top:22px;margin-bottom:0}
</style>
</head>
<body>
<main class="panel">
  <div class="eyebrow">MO Academy · Access control</div>
  <h1>Sign in</h1>
  <p>Enter your email and we'll send a single-use sign-in link. No passwords.</p>
  <form id="login-form" novalidate>
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@agency.int" autocomplete="email" required autofocus>
    <button type="submit">Send sign-in link</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="back"><a href="/">&larr; back to site</a></p>
</main>
<script>
(function(){
  const form=document.getElementById('login-form');
  const status=document.getElementById('status');
  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const email=document.getElementById('email').value.trim();
    if(!email){status.className='status err';status.textContent='ERR: enter an email address.';return;}
    status.className='status';status.textContent='TX: transmitting…';
    try{
      const res=await fetch('/api/auth/request-link',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(typeof data.detail==='string'?data.detail:'Request failed ('+res.status+')');
      status.className='status ok';
      status.textContent='ACK: '+(data.message||'Check your inbox for a sign-in link.');
      form.reset();
    }catch(err){
      status.className='status err';status.textContent='ERR: '+err.message;
    }
  });
})();
</script>
</body>
</html>
